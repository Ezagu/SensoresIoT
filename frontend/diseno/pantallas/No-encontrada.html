<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Página no encontrada</title>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:'Instrument Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
p,h1{margin:0}
a{color:inherit;text-decoration:none}
.nf{--bg:#0E1618;--raise:#1B2628;--line:rgba(232,238,236,.13);--soft:rgba(232,238,236,.065);--text:#E8EEEC;--dim:#A3AFB0;--faint:#7C898C;--accent:#4BA6B4;--accent-2:#86C5CE;--accent-ink:#04181D;--accent-wash:rgba(75,166,180,.13);--accent-line:rgba(75,166,180,.42);--ok:#6FB491}
.nf[data-theme="claro"]{--bg:#F3F0E9;--raise:#FFFFFF;--line:rgba(20,32,31,.16);--soft:rgba(20,32,31,.07);--text:#14201F;--dim:#4C5A5C;--faint:#66737A;--accent:#0A5C6B;--accent-2:#146272;--accent-ink:#FFFFFF;--accent-wash:rgba(10,92,107,.08);--accent-line:rgba(10,92,107,.30);--ok:#268056}
.nf{background:var(--bg);color:var(--text);display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:none;box-shadow:0 0 0 3px var(--accent-wash),0 0 0 1px var(--accent-line)}
.top{height:64px;display:flex;align-items:center;padding:0 48px;border-bottom:1px solid var(--soft)}
.mark{display:flex;align-items:center;gap:9px}
.mark .tick{width:3px;height:14px;background:var(--accent)}
.mark .name{font-weight:600;font-size:15px;letter-spacing:.16em}
.stage{flex:1;display:grid;grid-template-columns:auto 480px;align-items:center;justify-content:center;gap:120px;padding:0 64px 64px}
.art{width:480px;color:var(--text)}
.copy{display:flex;flex-direction:column;align-items:flex-start}
.big{font-size:128px;font-weight:600;letter-spacing:-.05em;line-height:.9;font-variant-numeric:tabular-nums}
.micro{font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
h1{margin-top:22px;font-size:40px;font-weight:600;letter-spacing:-.034em;line-height:1.02}
.sub{margin-top:14px;font-size:17px;color:var(--dim)}
.path{margin-top:10px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:13px;color:var(--faint)}
.path b{color:var(--text);font-weight:500}
.btn{margin-top:30px;height:48px;display:inline-flex;align-items:center;gap:10px;padding:0 22px;border-radius:5px;background:var(--accent);color:var(--accent-ink);font-size:15px;font-weight:500}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--accent-2)}
</style>
<div class="nf" data-theme="oscuro" style="width: 1440px; height: 900px;">
  <header class="top"><a class="mark" href="Panel-variado.html"><span class="tick"></span><span class="name">BITÁCORA</span></a></header>

  <main class="stage">
    <div class="copy">
      <span class="big">404</span>
      <h1>Esta página no existe.</h1>
      <p class="sub">La dirección que buscaste no se encontró.</p>
      <p class="path">No encontramos <b>/equipos/invernadero-nort</b></p>
      <a class="btn" href="Panel-variado.html">Volver al panel<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></a>
    </div>
    <svg class="art" viewBox="0 0 480 330" fill="none" role="img" aria-label="Una barra de direcciones: /equipos lleva a una página que existe; /equipos/invernadero-nort lleva a una página vacía, punteada, que no existe">
      <g stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
        <rect x="0.75" y="0.75" width="478.5" height="46" rx="8" fill="var(--raise)" stroke-opacity=".35"></rect>
        <path d="M18 18l-5 5.5 5 5.5M30 18l5 5.5-5 5.5" stroke-opacity=".35" stroke-width="1.4"></path>

        <path d="M72 47v103" stroke-opacity=".4" stroke-width="1.4"></path>
        <path d="M195 47v38c0 12 8 20 20 20h95c12 0 20 8 20 20v25" stroke="var(--accent)" stroke-width="1.6" stroke-dasharray="3 7"></path>

        <!-- la que existe -->
        <path d="M22 150h82l18 18v142H22Z" fill="var(--raise)" stroke-opacity=".5" stroke-width="1.3"></path>
        <path d="M104 150v18h18" stroke-opacity=".5" stroke-width="1.3"></path>
        <path d="M40 186h56M40 204h64M40 222h48M40 250h64M40 268h40" stroke-opacity=".3" stroke-width="1.3"></path>

        <!-- la que no -->
        <path d="M270 150h102l18 18v142H270Z" stroke="var(--accent)" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="5 6"></path>
        <path d="M372 150v18h18" stroke="var(--accent)" stroke-opacity=".8" stroke-width="1.4" stroke-dasharray="5 6"></path>
      </g>
      <g style="font-family: 'IBM Plex Mono', monospace; font-size: 14px;">
        <text x="52" y="29"><tspan fill="currentColor" fill-opacity=".55">/equipos/</tspan><tspan fill="var(--accent-2)">invernadero-nort</tspan></text>
        <text x="330" y="240" text-anchor="middle" fill="var(--accent-2)" style="font-size: 26px; font-weight: 500;">?</text>
      </g>
    </svg>
  </main>
</div>
</body>
</html>
