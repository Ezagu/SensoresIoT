<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <script>
      /* Estampa el tema antes del primer paint: el módulo de la app corre al
         final del body, y sin esto un SO en claro mostraría un frame oscuro. */
      try {
        var t = localStorage.getItem('bitacora-tema')
        var claro =
          t === 'claro' ||
          (t !== 'oscuro' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = claro ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B1012" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    />
    <title>Bitácora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
