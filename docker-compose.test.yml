name: sensores_test

services:
  db_test:
    image: timescale/timescaledb:latest-pg17
    container_name: sensores_db_test
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    # Base efímera: cada `up` arranca sin datos y vuelve a correr init.sql.
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 5s
      retries: 10
